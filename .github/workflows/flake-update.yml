name: Update Flake & Packages

on:
  schedule:
    # Run weekly on Sundays at 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch: # Allow manual triggering

jobs:
  update-flake:
    name: Update Flake Lock & Package Versions
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: dev

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Set up Cachix
        uses: cachix/cachix-action@v17
        with:
          name: lazylibrarian-flake
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          skipPush: true
        continue-on-error: true

      - name: Update flake.lock
        run: nix flake update

      # Upstream tags no releases, so track the master branch by commit.
      - name: Check and update LazyLibrarian package
        run: nix run nixpkgs#nix-update -- --flake --version=branch lazylibrarian
        continue-on-error: true

      - name: Check and update iso639-lang python package
        run: nix run nixpkgs#nix-update -- --flake iso639-lang
        continue-on-error: true

      - name: Check and update slskd-api python package
        run: nix run nixpkgs#nix-update -- --flake slskd-api
        continue-on-error: true

      - name: Regenerate options documentation
        run: nix run .#generate-docs

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          # Use a PAT/App token (not GITHUB_TOKEN) so the opened PR and its
          # merge are attributed to a real identity. GITHUB_TOKEN-driven events
          # do NOT trigger other workflows, which would leave ci.yml and
          # promote.yml from ever running on the automated update.
          token: ${{ secrets.AUTOMATION_TOKEN }}
          base: dev
          branch: automated/weekly-flake-update
          commit-message: "chore: weekly flake lock, package versions & docs update"
          title: "chore: weekly flake lock, package versions & docs update"
          body: |
            Automated weekly updates generated by GitHub Actions.

            This PR includes updates for:
            - Flake lock file inputs (`flake.lock`)
            - Upstream LazyLibrarian commit and its unpackaged Python dependencies (via `nix-update`)
            - Auto-generated NixOS and Home Manager options docs (`docs/`)

            CI checks will run automatically on this PR targeting the `dev` branch.
          labels: |
            updates
            automated-pr
          delete-branch: true

      - name: Enable Auto-Merge
        if: steps.cpr.outputs.pull-request-operation == 'created'
        env:
          GITHUB_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: gh pr merge --auto --merge "${{ steps.cpr.outputs.pull-request-number }}"
